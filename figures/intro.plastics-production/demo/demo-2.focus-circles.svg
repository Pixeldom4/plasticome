<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="205mm" height="118mm" viewBox="0 0 205 118">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="10.0" y="12.0" font-family="'Ubuntu Sans Mono'" font-size="7" font-weight="bold" fill="#111111">A.</text>
<text x="19.2" y="12.0" font-family="'Ubuntu Sans Mono'" font-size="7" font-weight="bold" fill="#111111">Plastic Waste Holds More Carbon Than All Animals</text>
<text x="19.2" y="17.5" font-family="'Ubuntu Sans', Helvetica, Arial, sans-serif" font-size="3.1" fill="#5b5b5b">Carbon mass in 2026 (Gt C). Plastics: notebook model from Geyer 2017 and Pottinger 2024. Life: Bar-On et al. 2018.</text>
<circle cx="29.15" cy="60.85" r="17.15" fill="#f0c5a6" stroke="#e59f6c" stroke-width="0.5"/>
<text x="29.15" y="83.00" font-family="'Ubuntu Sans', Helvetica, Arial, sans-serif" font-size="3.4" font-weight="bold" text-anchor="middle" fill="#111111">Fungi</text>
<text x="29.15" y="87.00" font-family="'Ubuntu Sans', Helvetica, Arial, sans-serif" font-size="3.0" font-weight="normal" text-anchor="middle" fill="#5b5b5b">12 Gt C</text>
<circle cx="65.39" cy="64.90" r="13.10" fill="#ecde97" stroke="#ddc23c" stroke-width="0.5"/>
<text x="65.39" y="83.00" font-family="'Ubuntu Sans', Helvetica, Arial, sans-serif" font-size="3.4" font-weight="bold" text-anchor="middle" fill="#111111">Archaea</text>
<text x="65.39" y="87.00" font-family="'Ubuntu Sans', Helvetica, Arial, sans-serif" font-size="3.0" font-weight="normal" text-anchor="middle" fill="#5b5b5b">7 Gt C</text>
<circle cx="94.38" cy="68.10" r="9.90" fill="#7cd9de" stroke="#33c0c8" stroke-width="0.5"/>
<text x="94.38" y="83.00" font-family="'Ubuntu Sans', Helvetica, Arial, sans-serif" font-size="3.4" font-weight="bold" text-anchor="middle" fill="#111111">Protists</text>
<text x="94.38" y="87.00" font-family="'Ubuntu Sans', Helvetica, Arial, sans-serif" font-size="3.0" font-weight="normal" text-anchor="middle" fill="#5b5b5b">4 Gt C</text>
<circle cx="117.28" cy="71.00" r="7.00" fill="#f2b3b4" stroke="#e1595b" stroke-width="0.5"/>
<text x="117.28" y="83.00" font-family="'Ubuntu Sans', Helvetica, Arial, sans-serif" font-size="3.4" font-weight="bold" text-anchor="middle" fill="#111111">Animals</text>
<text x="117.28" y="87.00" font-family="'Ubuntu Sans', Helvetica, Arial, sans-serif" font-size="3.0" font-weight="normal" text-anchor="middle" fill="#5b5b5b">2 Gt C</text>
<circle cx="154.07" cy="62.22" r="15.78" fill="none" stroke="#1b5998" stroke-width="0.5" stroke-dasharray="1.2 0.8"/>
<circle cx="154.07" cy="65.18" r="12.82" fill="#7db3e8" stroke="#1b5998" stroke-width="0.8"/>
<text x="154.07" y="83.00" font-family="'Ubuntu Sans', Helvetica, Arial, sans-serif" font-size="3.4" font-weight="bold" text-anchor="middle" fill="#111111">Plastic still on Earth</text>
<text x="154.07" y="87.00" font-family="'Ubuntu Sans', Helvetica, Arial, sans-serif" font-size="3.0" font-weight="normal" text-anchor="middle" fill="#5b5b5b">6.7 Gt C</text>
<text x="154.07" y="44.24" font-family="'Ubuntu Sans', Helvetica, Arial, sans-serif" font-size="2.7" font-weight="normal" text-anchor="middle" fill="#5b5b5b">dashed: all ever produced, 10.2 Gt C</text>
<path d="M117.28,62.50 V36.94 H154.07 V40.94" fill="none" stroke="#1b5998" stroke-width="0.4"/>
<path d="M152.97,39.44 L154.07,41.24 L155.17,39.44" fill="none" stroke="#1b5998" stroke-width="0.4"/>
<text x="135.67" y="35.34" font-family="'Ubuntu Sans', Helvetica, Arial, sans-serif" font-size="3.3" font-weight="bold" text-anchor="middle" fill="#1b5998">3.4× the carbon in all animals</text>
<circle cx="16.95" cy="98.00" r="4.95" fill="#aeaeae" stroke="#989898" stroke-width="0.4"/>
<text x="23.90" y="99.00" font-family="'Ubuntu Sans', Helvetica, Arial, sans-serif" font-size="3.0" font-weight="normal" text-anchor="start" fill="#5b5b5b">= 1 Gt of carbon (area)</text>
<text x="12.00" y="111.00" font-family="'Ubuntu Sans', Helvetica, Arial, sans-serif" font-size="2.8" font-weight="normal" text-anchor="start" fill="#5b5b5b">Not shown: plants (450 Gt C) and bacteria (70 Gt C), whose circles would be 15 and 6 times as wide as the animals circle.</text>
</svg>
